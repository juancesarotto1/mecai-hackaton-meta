name: deploy-xr-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/xr-experience/**"
      - "packages/engine-core/**"
      - "packages/engine-kinematics/**"
      - "packages/engine-schema/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-xr.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @motormind/xr-experience typecheck
      - run: pnpm --filter @motormind/xr-experience build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/xr-experience/dist
      - id: deployment
        uses: actions/deploy-pages@v4
